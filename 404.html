<!DOCTYPE html>
<html lang="en">
<head>
  <title>Error 404 - Template</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css?family=Work+Sans:400,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --para-color: #555555;
      --theme-color: #fff;
      --theme-hover-color: #333;
    }
    html { scroll-behavior: smooth; }
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Work Sans', sans-serif;
    }
    * { box-sizing: border-box; }
    button, input, select { -webkit-appearance: none; outline: none; }
    button, .btn, select { cursor: pointer; }
    a { text-decoration: none; }
    ul { margin: 0; padding: 0; }
    h1, h2, h3, h4, h5, h6, p { margin: 0; padding: 0; }
    p { color: #444; font-size: 16px; line-height: 24px; }

    /* Page */
    .page {
      position: absolute;
      width: 100%;
      z-index: 1;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    /* Content */
    .content {
      text-align: center;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      min-height: 100vh;
      align-items: center;
      padding: 30px 15px;
    }
    .w3l-error-grid {
      margin: 0px auto;
      max-width: 850px;
      text-align: center;
      padding: 1em;
    }
    .content h1 {
      font-weight: 700;
      font-size: 175px;
      color: #eee;
      opacity: .4;
    }
    .content h2 {
      font-size: 30px;
      margin-bottom: 10px;
      color: #eee;
      font-weight: 500;
    }
    .content p {
      font-size: 16px;
      color: #ccc;
      line-height: 24px;
      margin-top: 10px;
    }
    .content a.home {
      display: inline-block;
      font-size: 16px;
      border: 2px solid #CDD4DE;
      padding: 12px 30px;
      border-radius: 4px;
      cursor: pointer;
      color: #CDD4DE;
      margin-top: 50px;
      transition: 0.5s ease;
    }
    .content a.home:hover {
      border: 2px solid #fff;
      background: #fff;
      color: #333;
    }
    .copy-right p { color: #aaa; }
    .copy-right p a { color: #fff; }
    .copy-right p a:hover { color: #888; }

    a.brand-logo {
      color: var(--theme-color);
      font-weight: 600;
      font-size: 35px;
      line-height: 40px;
      border: none;
      background: none;
      padding: 0px;
      text-transform: uppercase;
    }

    /* Background image */
    img.bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      transform: scale(1.1);
      object-fit: cover;
    }

    /* Fallback dark gradient when image fails to load */
    .page.no-img {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
    }

    @media (max-width: 991px) {
      .content h1 { font-size: 120px; }
    }
    @media (max-width: 440px) {
      .content { padding-bottom: 20px; padding-top: 20px; }
      a.brand-logo { font-size: 30px; line-height: 35px; }
      .content h1 { font-size: 100px; }
      .content p { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="w3l-error-block">
    <div class="page" id="page">
      <div class="content">

        <!-- Logo / Brand -->
        <div class="logo">
          <a class="brand-logo" href="index.html">Error 404</a>
        </div>

        <!-- 404 Message -->
        <div class="w3l-error-grid">
          <h1>404</h1>
          <h2>Page not found</h2>
          <a class="home" href="index.html">&#8592; Go to Home</a>
        </div>

        <!-- Footer copyright -->
        <div class="copy-right text-center">
          <p id="copyright-line"></p>
          <p>Powered by: <a href="https://Wondermayank.github.io">Wondermayank</a></p>
        </div>

      </div>

      <!-- Parallax background image -->
      <img
        id="bgImg"
        src="https://ashendrade.github.io/404-Error-Template-1/images/bg.jpg"
        class="bg img-responsive"
        alt="background"
        onerror="document.getElementById('page').classList.add('no-img'); this.style.display='none';"
      />
    </div>
  </div>

  <script>
    /* ---------- Copyright line ---------- */
    (function () {
      var el   = document.getElementById('copyright-line');
      var year = new Date().getFullYear();
      el.innerHTML = '&copy; 2015 &ndash; ' + year + ' &mdash; Powered By Wondermayank';
    })();

    /* ---------- Parallax mouse effect (vanilla JS, no jQuery needed) ---------- */
    var bgImg    = document.getElementById('bgImg');
    var lFollowX = 0, lFollowY = 0;
    var x        = 0, y = 0;
    var friction = 1 / 30;

    function animate() {
      x += (lFollowX - x) * friction;
      y += (lFollowY - y) * friction;
      if (bgImg && bgImg.style.display !== 'none') {
        var t = 'translate(' + x + 'px, ' + y + 'px) scale(1.1)';
        bgImg.style.webkitTransform = t;
        bgImg.style.mozTransform    = t;
        bgImg.style.transform       = t;
      }
      window.requestAnimationFrame(animate);
    }

    function onMove(e) {
      var lMouseX = Math.max(-100, Math.min(100, window.innerWidth  / 2 - e.clientX));
      var lMouseY = Math.max(-100, Math.min(100, window.innerHeight / 2 - e.clientY));
      lFollowX = (20 * lMouseX) / 100;
      lFollowY = (10 * lMouseY) / 100;
    }

    window.addEventListener('mousemove', onMove);
    window.addEventListener('click',     onMove);
    animate();
  </script>
</body>
</html>
